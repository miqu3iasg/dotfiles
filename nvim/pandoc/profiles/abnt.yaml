# pandoc/profiles/abnt.yaml
#
# ABNT-like page layout profile. Select it with:
#
# :Pandoc pdf abnt
#
# The profile is loaded after metadata.yaml, so its values override the
# general metadata defaults. The note's own YAML front matter is applied
# later and can still override this profile.
pdf-engine: xelatex
mainfont: Times New Roman # Requires this font to be installed on the system.
fontsize: 12pt
linestretch: 1.5
geometry:
  - top=3cm
  - left=3cm
  - bottom=2cm
  - right=2cm
numbersections: true
indent: true
header-includes:
  - \usepackage{ragged2e}
  - \AtBeginDocument{\justifying}
  - \setlength{\parindent}{1.25cm}
  - \setlength{\parskip}{0pt}
  - \setlength{\emergencystretch}{3em}

# Optional settings. Uncomment only the options you want to enable.
# toc: true
# toc-title: Sumário
