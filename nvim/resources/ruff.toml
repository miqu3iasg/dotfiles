# Ruff: https://docs.astral.sh/ruff/configuration/
# Copy to the project root. If the project already has a pyproject.toml, move
# these keys under [tool.ruff] there instead: ruff reads a single config, and
# pyproject.toml takes precedence over ruff.toml in the same directory.

line-length = 100
target-version = "py312"

[lint]
select = [
	"E",   # pycodestyle errors
	"W",   # pycodestyle warnings
	"F",   # pyflakes
	"I",   # isort
	"N",   # pep8-naming
	"UP",  # pyupgrade
	"B",   # flake8-bugbear
	"C4",  # flake8-comprehensions
	"SIM", # flake8-simplify
	"RUF", # ruff-specific rules
]
# `ruff format` owns wrapping; long strings and URLs stay legal.
ignore = ["E501"]

[format]
quote-style = "double"
indent-style = "space"
