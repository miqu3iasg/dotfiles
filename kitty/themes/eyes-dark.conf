# eyes-dark.conf
# Kitty terminal theme baseado em amedoeyes/eyes.nvim (variante dark)
# https://github.com/amedoeyes/eyes.nvim
# Tema monocromático em tons de cinza

# --- Cores básicas ---
foreground              #A0A0A0
background              #000000

# --- Cursor ---
cursor                  #A0A0A0
cursor_text_color       #000000

# --- Seleção ---
selection_foreground    #A0A0A0
selection_background     #202020

# --- URLs ---
url_color               #808080

# --- Bordas de janela (kitty splits) ---
active_border_color     #808080
inactive_border_color   #404040
bell_border_color       #808080

# --- Barra de abas ---
tab_bar_background      #000000
active_tab_foreground   #000000
active_tab_background   #A0A0A0
inactive_tab_foreground #707070
inactive_tab_background #101010

# --- Cores do terminal (0-15) ---
# black
color0   #000000
color8   #000000
# red
color1   #404040
color9   #404040
# green
color2   #606060
color10  #606060
# yellow
color3   #808080
color11  #808080
# blue
color4   #404040
color12  #404040
# magenta
color5   #606060
color13  #606060
# cyan
color6   #808080
color14  #808080
# white
color7   #A0A0A0
color15  #A0A0A0
