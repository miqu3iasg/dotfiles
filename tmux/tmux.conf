# ~/.config/tmux/tmux.conf

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'sainnhe/tmux-fzf'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-pane-contents-area 'visible'
set -g @resurrect-save 'C-s'
set -g @resurrect-restore 'C-t'

# Terminal
set -g default-shell /usr/bin/zsh
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:clipboard"
set -as terminal-features ",xterm-256color:RGB:clipboard"
set -as terminal-features ",alacritty:RGB:clipboard:sync"
set -s extended-keys on
set -s extended-keys-format csi-u

# Prefix
unbind-key C-b
set -g prefix C-space
bind C-space send-prefix

# General options
set -g mouse off
set -g history-limit 102400
set -g repeat-time 225
set -g escape-time 10
set -g focus-events on
set -g renumber-windows on
set -g set-clipboard on
set -g status-position bottom
set -g status-keys vi
setw -g mode-keys vi
set -g base-index 0
setw -g pane-base-index 0
set -g automatic-rename off
set -g pane-scrollbars off
set -g pane-border-indicators off
set -g detach-on-destroy off
set -g set-titles on
set -g set-titles-string "#{pane_title}"

# Rename
bind , command-prompt -I "#W" "rename-window -- '%%'"
bind '$' command-prompt -I "#S" "rename-session -- '%%'"

# Windows
bind t new-window -a -c "#{pane_current_path}"
bind l last-window
bind -r n next-window
bind -r p previous-window
bind -r H swap-window -t -1
bind -r L swap-window -t +1

# Panes
bind -r '{' swap-pane -U
bind -r '}' swap-pane -D
bind m resize-pane -Z

# Splits
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# Break and join
bind b break-pane -a
bind B break-pane -ad
bind y join-pane -h -t ':!'

# Quick access and tab management
bind u select-window -t :0
bind i select-window -t :1
bind o select-window -t :2

bind U join-pane -d -t :0
bind I join-pane -d -t :1
bind O join-pane -d -t :2

# Alternative binds with free destinations
bind J command-prompt -p "join pane from:" "join-pane -hbs '%%'"
bind P command-prompt -p "send pane to window:" "join-pane -t ':%%'"

# Workspace
bind-key C-w if-shell 'tmux select-window -t :workspace 2>/dev/null' '' {
  new-window -db -n workspace -t 1 -c "#{pane_current_path}"
  split-window -bdh -t :workspace -c "#{pane_current_path}"
  select-layout -t :workspace even-horizontal
  if-shell 'tmux has-session -t =UwU' '' 'rename-session "UwU"'
}

# Kill
bind x switch-client -T kill

bind -T kill x kill-pane
bind -T kill p kill-pane
bind -T kill P confirm-before -p "kill other panes? (y/n)"    "kill-pane -a"
bind -T kill w kill-window
bind -T kill W confirm-before -p "kill other windows? (y/n)"  "kill-window -a"
bind -T kill s confirm-before -p "kill session #S? (y/n)"     kill-session
bind -T kill S confirm-before -p "kill other sessions? (y/n)" "kill-session -a"

# Layout
bind a switch-client -T layout

bind -T layout v select-layout even-horizontal
bind -T layout s select-layout even-vertical
bind -T layout t select-layout tiled
bind -T layout m select-layout main-vertical

# Resize
bind r switch-client -T resize

bind -T resize h resize-pane -L 3 \; switch-client -T resize
bind -T resize j resize-pane -D 3 \; switch-client -T resize
bind -T resize k resize-pane -U 3 \; switch-client -T resize
bind -T resize l resize-pane -R 3 \; switch-client -T resize

bind -T resize H resize-pane -L 10 \; switch-client -T resize
bind -T resize J resize-pane -D 10 \; switch-client -T resize
bind -T resize K resize-pane -U 10 \; switch-client -T resize
bind -T resize L resize-pane -R 10 \; switch-client -T resize

bind -T resize Escape switch-client -T root
bind -T resize Enter switch-client -T root
bind -T resize q switch-client -T root

# Sync panes
bind S setw synchronize-panes \; display "sync: #{?pane_synchronized,ON,OFF}"

# Copy mode
bind c copy-mode
bind [ copy-mode
bind / copy-mode \; send-keys /

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection
bind -T copy-mode-vi Y send-keys -X copy-end-of-line
bind -T copy-mode-vi H send-keys -X start-of-line
bind -T copy-mode-vi L send-keys -X end-of-line
bind -T copy-mode-vi Escape send-keys -X cancel

# Sessions, tree and toggles
bind T set -g status

bind Space choose-tree -Zs
bind W choose-tree -Zw

bind Tab switch-client -l
bind N command-prompt -p "new session name:" "new-session -A -s '%1' -c '#{pane_current_path}'"

bind M command-prompt -p "move window to session:" "move-window -t '%1:'"
bind Z run-shell 'tmux switch-client -t "$(tmux new-session -dP -F "##{session_name}" -c ~ -s "tmp-$(date +%H%M%S)")"'

# Launchers
bind f display-popup -E -w 60% -h 60% ~/.local/bin/tmux-sessionizer

bind g switch-client -T go
bind -T go c run-shell "~/.local/bin/tmux-sessionizer ~/.config"
bind -T go d run-shell "~/.local/bin/tmux-sessionizer ~/.local/share/chezmoi"
bind -T go b display-popup -E -w 70% -h 70% "bluetui"

# Theme
source-file -q ~/.config/tmux/theme.conf

# Reload
bind C-r source-file -q ~/.config/tmux/tmux.conf \; display-message "tmux configuration reloaded"

# TPM must stay last
run '~/.tmux/plugins/tpm/tpm'
