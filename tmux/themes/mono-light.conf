set -g status-style "bg=#f6f1e4,fg=#2a2824"
set -g status-left "#[fg=#2a2824,bold] [#S] "
set -g status-left-length 24
set -g status-right ""
set -g mode-style "bg=#e0d9c3,fg=#1c1b18"
set -g message-style "bg=#f6f1e4,fg=#2a2824"

setw -g window-status-current-style "none"
setw -g window-status-current-format "#[fg=#2a2824,bg=#f6f1e4] #I:#{pane_title} #{window_flags} "
setw -g window-status-format "#[fg=#7d7869,bg=default] #I:#{pane_title} #{window_flags} "

set -g pane-border-lines single
set -g pane-border-style "fg=#cdc6b0"
set -g pane-active-border-style "fg=#7d7869"
