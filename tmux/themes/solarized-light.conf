set -g status-style "bg=colour15,fg=colour10"
set -g status-left "#[fg=colour10,bold] [#S] "
set -g status-left-length 24
set -g status-right ""
set -g mode-style "bg=colour7,fg=colour0"

set -g message-style "bg=colour7,fg=colour10"
set -g message-command-style "bg=colour7,fg=colour0"

setw -g window-status-current-style "none"
setw -g window-status-current-format "#[fg=colour0,bg=colour15] #I:#{pane_title} #{window_flags} "
setw -g window-status-format "#[fg=colour14,bg=default] #I:#{pane_title} #{window_flags} "

set -g pane-border-lines single
set -g pane-border-style "fg=colour14"
set -g pane-active-border-style "fg=colour11"
