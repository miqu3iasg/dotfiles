gui:
  showFileTree: true
  nerdFontsVersion: "3"
  border: "single"
  showRandomTip: false
  filterMode: fuzzy
  showIcons: false
  commandLogSize: 0
git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never
os:
  editPreset: nvim

notARepository: quit
promptToReturnFromSubprocess: false
