add_newline = true

# ------------------------------------------------------------------
# Troque entre os temas alterando a linha abaixo:
#   palette = "eyes_dark"  -> tons de cinza (discreto)
#   palette = "insanity"   -> cores vivas do tema Kitty
# ------------------------------------------------------------------
palette = "insanity"

# format = """
# $username\
# $hostname\
# $directory\
# $git_branch\
# $git_state\
# $git_status\
# $git_metrics\
# ${custom.git_worktree}\
# $shlvl\
# $fill\
# $line_break\
 #$character"""

format = """
$username\
$hostname\
$directory\
$fill\
$line_break\
$character"""
# ------------------------------------------------------------------
# Paleta "eyes_dark" — mesmos cinzas do terminal, do mais claro
# (texto principal) ao mais escuro/próximo do fundo preto
# (info secundária/decorativa).
# ------------------------------------------------------------------
[palettes.eyes_dark]
fg       = "#A0A0A0"  # foreground do terminal — elementos primários
muted    = "#808080"  # color3/6 (yellow/cyan) — secundário (git status, duração)
subtle   = "#606060"  # color2/5 (green/magenta) — mais discreto (worktree, jobs)
faint    = "#404040"  # color1/4 (red/blue) — bem discreto (fill, hora)
faintest = "#202020"  # selection_background — quase invisível no fundo preto
red      = "#A09090"  # quase cinza, leve toque vermelho
green    = "#90A090"  # quase cinza, leve toque verde
yellow   = "#808080"
blue     = "#808080"
magenta  = "#606060"
cyan     = "#808080"
git_add  = "#90A090"  # linhas adicionadas
git_del  = "#A09090"  # linhas removidas

# ------------------------------------------------------------------
# Paleta "insanity" — as cores originais (normal + bright) do tema
# Kitty, sem suavização em cinza.
# ------------------------------------------------------------------
[palettes.insanity]
fg       = "#d0d0d0"  # foreground do terminal
muted    = "#b9b9b9"  # white normal — secundário (hostname, shlvl)
subtle   = "#87ffff"  # cyan bright — discreto (worktree, jobs)
faint    = "#4e4e4e"  # black bright — bem discreto (fill, hora)
faintest = "#202020"  # quase invisível no fundo preto
red      = "#ff5f5f"  # red bright
green    = "#87d787"  # green bright
yellow   = "#ffd751"  # yellow bright
blue     = "#5fafff"  # blue bright
magenta  = "#d75fd7"  # magenta bright
cyan     = "#87ffff"  # cyan bright
git_add  = "#87d787"  # linhas adicionadas
git_del  = "#ff5f5f"  # linhas removidas

# ------------------------------------------------------------------
# User / host — só aparece em contextos que importam (root, ssh)
# ------------------------------------------------------------------
[username]
show_always = true
style_user = "bold fg:green"
style_root = "bold underline fg:red"
format = "[$user]($style)@"

[hostname]
ssh_only = false
style = "fg:green"
format = "[$hostname]($style) "

# ------------------------------------------------------------------
# Directory
# ------------------------------------------------------------------
[directory]
style = "bold fg:blue"
format = "[$read_only]($style)[$path]($style) "
truncation_length = 3
truncation_symbol = "./"
truncate_to_repo = false
read_only = "[ro] "

# ------------------------------------------------------------------
# Git — branch, estado (merge/rebase), status, worktree
# ------------------------------------------------------------------
[git_branch]
style = "bold fg:magenta"
format = "[$branch]($style)"
truncation_length = 24
truncation_symbol = "…"

[git_state]
style = "fg:yellow"
format = '\([$state( $progress_current/$progress_total)]($style)\) '

[git_status]
style = "fg:red"
format = '([ $all_status$ahead_behind]($style))'
conflicted = "conflict $count "
untracked  = "untracked $count "
stashed    = "stash $count "
modified   = "modified $count "
staged     = "staged $count "
renamed    = "renamed $count "
deleted    = "deleted $count "
ahead      = "ahead $count "
behind     = "behind $count "
diverged   = "diverged $ahead_count/$behind_count "
up_to_date = ""

[git_metrics]
disabled = false
added_style = "fg:git_add"
deleted_style = "fg:git_del"
format = '([+$added]($added_style) )([-$deleted]($deleted_style) )'

[custom.git_worktree]
description = "Indica quando está dentro de um git worktree (não a árvore principal)"
command = '''
common_dir=$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null)
git_dir=$(git rev-parse --path-format=absolute --git-dir 2>/dev/null)
if [ "$common_dir" != "$git_dir" ]; then
  echo "worktree"
fi
'''
when = "git rev-parse --is-inside-work-tree >/dev/null 2>&1"
format = "[ $output]($style) "
style = "fg:subtle"
require_repo = true
ignore_timeout = true

# ------------------------------------------------------------------
# Produtividade / contexto de execução
# ------------------------------------------------------------------
[shlvl]
disabled = false
threshold = 2
style = "fg:muted"
format = "[ shlvl:$shlvl]($style) "

[fill]
symbol = " "
style = "fg:faint"

[cmd_duration]
min_time = 2000
show_milliseconds = false
style = "fg:yellow"
format = "[ $duration]($style) "

[status]
disabled = false
style = "bold underline fg:red"
format = "[ exit $status]($style) "

[jobs]
style = "fg:subtle"
symbol = ""
format = "[ $number job]($style) "

[time]
disabled = false
style = "fg:faint"
format = "[$time]($style)"
time_format = "%H:%M"

# ------------------------------------------------------------------
# Prompt character — λ sempre presente; verde no sucesso, vermelho
# sublinhado no erro.
# ------------------------------------------------------------------
[character]
success_symbol = "[λ ](bold fg:green)"
error_symbol   = "[λ ](bold underline fg:red)"
vicmd_symbol   = "[λ ](bold fg:blue)"

# ------------------------------------------------------------------
# Módulos de linguagem/infra — texto puro, sem ícone, só aparecem
# quando relevantes no diretório atual. Ajuste/remova o que não usa.
# ------------------------------------------------------------------
[nodejs]
symbol = ""
style = "fg:green"
format = "[node $version]($style) "

[python]
symbol = ""
style = "fg:yellow"
format = '[py $version(\($virtualenv\))]($style) '

[rust]
symbol = ""
style = "fg:red"
format = "[rust $version]($style) "

[golang]
symbol = ""
style = "fg:subtle"
format = "[go $version]($style) "

[package]
symbol = ""
style = "fg:magenta"
format = "[pkg $version]($style) "

[docker_context]
symbol = ""
style = "fg:blue"
format = "[docker $context]($style) "
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]

[aws]
symbol = ""
style = "fg:yellow"
format = "[aws $profile( $duration)]($style) "

[kubernetes]
disabled = false
symbol = ""
style = "fg:blue"
format = '[k8s $context( ($namespace))]($style) '
