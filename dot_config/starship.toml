scan_timeout = 200
command_timeout = 1000
add_newline = false

palette = "mono"

format = """
${custom.venv}\
$username\
$hostname\
$container\
$directory\
$git_branch\
$git_commit\
$git_state\
${custom.git_worktree}\
${custom.vpn}\
${env_var.HTTP_PROXY}\
$status\
$jobs\
$character"""

