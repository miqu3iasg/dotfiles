[username]
show_always = true
# style_user = "bold fg:green"
# style_root = "bold underline fg:red"
style_user = "fg:green"
style_root = "underline fg:red"
format = "[$user]($style)@"

[hostname]
ssh_only = false
style = "fg:green"
format = "[$hostname]($style):"

[directory]
# style = "bold fg:blue"
style = "fg:blue"
format = "[$read_only]($style)[$path]($style) "
truncation_length = 5
truncation_symbol = "./"
truncate_to_repo = false
read_only = "[ro] "

[container]
symbol = ""
style = "fg:yellow"
format = '[\[$name\]]($style) '

[custom.venv]
description = "virtualenv name"
when = 'test -n "$VIRTUAL_ENV"'
command = 'basename "$VIRTUAL_ENV"'
style = "fg:subtle"
format = '[\($output\) ]($style)'

[git_branch]
style = "fg:muted"
truncation_length = 32
truncation_symbol = "..."
format = '[\($branch\)]($style) '

[git_commit]
only_detached = true
tag_disabled = true
commit_hash_length = 8
style = "fg:yellow"
format = '[ \($hash\)]($style)'

[git_state]
style = "fg:yellow"
format = ' \([$state( $progress_current/$progress_total)]($style)\)'

[git_status]
conflicted = " conflict $count"
staged = " staged $count"
modified = ""
renamed = " renamed $count"
deleted = " deleted $count"
untracked = ""
stashed = " stash $count"
ahead = " ahead $count"
behind = " behind $count"
diverged = " diverged $ahead_count/$behind_count"
up_to_date = ""
format = '([$conflicted](bold fg:git_del)[$deleted](fg:git_del)[$staged](fg:git_add)[$renamed](fg:muted)[$stashed](fg:subtle)[$ahead_behind](fg:yellow))'

[custom.git_worktree]
when = 'test -f .git'
command = "echo worktree"
style = "fg:subtle"
format = "[ $output]($style)"
require_repo = true

[custom.vpn]
when = 'test -d /sys/class/net/tun0 || test -d /sys/class/net/wg0'
command = "echo vpn"
style = "fg:yellow"
format = "[ $output]($style)"

[env_var.HTTP_PROXY]
variable = "HTTP_PROXY"
style = "fg:yellow"
format = "[ proxy]($style)"

[status]
disabled = false
pipestatus = true
symbol = ""
success_symbol = ""
not_found_symbol = ""
sigint_symbol = ""
signal_symbol = ""
style = "bold fg:red"
format = '[ exit $status( $signal_name)]($style)'
pipestatus_format = '[ \[$pipestatus\] exit $status( $signal_name)]($style)'

[cmd_duration]
min_time = 5000
show_milliseconds = false
style = "fg:yellow"
format = "[ $duration]($style)"

[jobs]
symbol = ""
number_threshold = 1
style = "fg:subtle"
format = "[ $number job]($style)"

[character]
success_symbol = "[\\$ ](fg:fg)"
error_symbol = "[\\$ ](fg:red)"
vicmd_symbol = "[:](fg:blue) "
