# ~/.config/tmux/tmux.conf

# Plugin declarations
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'sainnhe/tmux-fzf'

# Session persistence
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-pane-contents-area 'visible'
set -g @resurrect-save 'C-s'
set -g @resurrect-restore 'C-t'

set -g @yank_with_mouse 'off'

# Shell
set -g default-shell /usr/bin/zsh

# Terminal capabilities
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:clipboard:sync"
set -as terminal-features ",xterm-256color:RGB:clipboard"
set -as terminal-features ",alacritty:RGB:clipboard:sync"

# Extended key reporting allows terminals that support CSI-u to distinguish
# modified keys that tmux otherwise cannot represent, including C-Tab,
# modified function-like keys, and C-1 through C-9
set -s extended-keys on
set -s extended-keys-format csi-u

# Prefix
unbind-key C-b
set -g prefix C-space

# General / performance
set -g mouse off
set -g history-limit 102400
set -g repeat-time 225
set -g escape-time 0
set -g focus-events on
set -g renumber-windows on
set -g set-clipboard on
set -g status-position bottom
set -g status-keys vi
setw -g mode-keys vi
set -g base-index 0
setw -g pane-base-index 0
# set -g automatic-rename on
set -g automatic-rename off # Keep window names independent of the active command
set -g pane-scrollbars off
set -g pane-border-indicators off

# Preserve the client when its current session is destroyed. tmux switches
# to the most recently used remaining session instead of detaching; the
# client only exits when no sessions remain
set -g detach-on-destroy off

set-option -g set-titles on
set-option -g set-titles-string "#{pane_title}"

# Windows
bind t new-window -c "#{pane_current_path}"
bind q kill-window
bind R command-prompt -I "#W" "rename-window '%%'"
bind l last-window

bind H swap-window -t -1
bind L swap-window -t +1

bind C-n select-layout even-vertical
bind C-p select-layout even-horizontal

# Splits / pane navigation
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Create a temporary two-pane workspace in window 1 and return to the
# previously active window
bind-key C-w \
  new-window -t 1 -c "#{pane_current_path}" \;\
  split-window -bd -h -c "#{pane_current_path}" \;\
  select-layout even-horizontal \;\
  select-window -l \;\
  if-shell 'tmux has-session -t =UwU' '' 'rename-session "UwU"'

bind-key J command-prompt -p "join pane from:" "join-pane -hbs '%%'"

bind w kill-pane
bind E kill-pane -a

bind m resize-pane -Z
bind o rotate-window -D
bind O rotate-window -U

# Resize mode
bind r switch-client -T resize

bind -T resize h resize-pane -L 3 \; switch-client -T resize
bind -T resize j resize-pane -D 3 \; switch-client -T resize
bind -T resize k resize-pane -U 3 \; switch-client -T resize
bind -T resize l resize-pane -R 3 \; switch-client -T resize

bind -T resize H resize-pane -L 10 \; switch-client -T resize
bind -T resize J resize-pane -D 10 \; switch-client -T resize
bind -T resize K resize-pane -U 10 \; switch-client -T resize
bind -T resize L resize-pane -R 10 \; switch-client -T resize

bind -T resize Escape switch-client -T root
bind -T resize Enter switch-client -T root
bind -T resize q switch-client -T root

# Copy mode
bind c copy-mode
bind [ copy-mode
bind / copy-mode \; send-keys /

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

bind -T copy-mode-vi y send-keys -X copy-selection
bind -T copy-mode-vi Y send-keys -X end-of-line \; send-keys -X copy-selection

bind -T copy-mode-vi H send-keys -X start-of-line
bind -T copy-mode-vi L send-keys -X end-of-line

bind -T copy-mode-vi Escape send-keys -X cancel

# Toggle status bar
bind T set -g status

# Sessions
bind Space choose-tree -Zs
bind W choose-tree -Zw
bind Tab switch-client -l
# ( and ) retain tmux's default previous/next-session bindings

bind N command-prompt -p "new session name:" "new-session -A -s '%1' -c '#{pane_current_path}'"
# Session renaming remains available through tmux's default prefix+$ binding

bind z run-shell -b "~/.tmux/plugins/tmux-fzf/scripts/session.sh switch"

bind M command-prompt -p "move window to session:" "move-window -t '%1:'"

bind x kill-session
bind X confirm-before -p "kill session #S? (y/n)" kill-session
bind K confirm-before -p "kill ALL other sessions? (y/n)" "kill-session -a"

# Use the sessionizer for directory-driven session management
bind-key -r f if-shell "$is_vim" \
    'run-shell "tmux neww ~/.local/bin/tmux-sessionizer"' \
    'send-keys " ~/.local/bin/tmux-sessionizer" Enter'

bind C run-shell "~/.local/bin/tmux-sessionizer ~/.config"
bind D run-shell "~/.local/bin/tmux-sessionizer ~/.local/share/chezmoi"
bind B display-popup -E -w 70% -h 70% "bluetui"
# TODO: add bind to open a global todo.md file

# Clear the scrollback history of the active pane without affecting the
# running process or the current terminal screen state
bind -n C-S-x clear-history

# Theme / visual
# The commented options belong to minimal-tmux-status. If that plugin is
# re-enabled, restart the tmux server after restoring these settings so TPM
# does not retain options from a previously loaded plugin configuration.
# set -g @minimal-tmux-bg "#101010"
# set -g @minimal-tmux-fg "#A0A0A0"

set -g status-style "bg=#000000,fg=#d0d0d0"
set -g status-left "#[fg=#d0d0d0,bold] [#S] "
set -g status-left-length 24
# tmux-continuum adds its automatic-save indicator to status-right during
# TPM initialization, so the base value must be defined before TPM runs.
set -g status-right ""

setw -g window-status-current-format "#[fg=#d1d0d0,bg=#000000] #I:#{pane_title} #{window_flags} "
setw -g window-status-format "#[fg=#707070,bg=default] #I:#{pane_title} #{window_flags} "

set -g pane-border-lines single
set -g pane-border-style "fg=#404040,bg=#000000"
set -g pane-active-border-style "fg=#808080,bg=#000000"

set -g message-style "bg=#202020,fg=#d0d0d0"

# Load either supported configuration path when reloading
bind C-r source-file -q ~/.tmux.conf \; source-file -q ~/.config/tmux/tmux.conf \; display-message "tmux configuration reloaded"

# TPM must remain the final plugin initialization command so all plugin
# declarations and plugin-dependent options are available before startup.
run '~/.tmux/plugins/tpm/tpm'
