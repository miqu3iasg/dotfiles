# ~/.tmux.conf

# Plugins & Theme
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'semi710/minimal-tmux-status'
run '~/.tmux/plugins/tpm/tpm'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-pane-contents-area 'visible'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g pane-scrollbars off
set -g pane-border-indicators off

set -g @plugin 'sainnhe/tmux-fzf'

set -g @plugin 'tmux-plugins/tmux-yank'

# Shell
set -g default-shell /usr/bin/zsh
set -g default-command /usr/bin/zsh

# Terminal capabilities
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-256color:clipboard"

# Extended keys
unbind-key -T root C-l
# set -s extended-keys on
# set -s extended-keys-format csi-u

# Prefix
# Change bind key to ctrl-space (default ctrl-b is freed up for
# zsh's autosuggest-accept, see .zshrc)
unbind-key C-b
set -g prefix C-space

# general/performance
set -g mouse off
set -g history-limit 102400
set -g repeat-time 225
set -g escape-time 0
set -g focus-events on
set -g renumber-windows on
set -g set-clipboard on
set -g status-position bottom
set -g status-keys vi
setw -g mode-keys vi
set -g base-index 0
setw -g pane-base-index 0
# set -g automatic-rename on
set -g automatic-rename off # Do not automatically rename windows from the running command.

# Set tmux pane title as terminal window title
set-option -g set-titles on
set-option -g set-titles-string "#{pane_title}"

# windows
bind t new-window -c "#{pane_current_path}"     # leader+t -> new tab
bind q kill-window                               # leader+q -> close tab
bind R command-prompt -I "#W" "rename-window '%%'"   # leader+Shift+R -> rename

bind -n C-Tab next-window
bind -n C-S-Tab previous-window

bind H swap-window -t -1
bind L swap-window -t +1

# quick layout switching
bind C-n select-layout even-vertical
bind C-p select-layout even-horizontal

# splits/pane navigation
bind s split-window -v -c "#{pane_current_path}"   # leader+s horizontal
bind v split-window -h -c "#{pane_current_path}"   # leader+v vertical

# extra split shortcuts (common tmux convention, current path preserved)
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n C-S-h select-pane -L
bind -n C-S-j select-pane -D
bind -n C-S-k select-pane -U
bind -n C-S-l select-pane -R

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

bind-key b new-window -c "#{pane_current_path}"

bind-key y new-session -s temp

bind-key C-w \
  new-window -t 1 -c "#{pane_current_path}" \;\
  split-window -bd -h -c "#{pane_current_path}" \;\
  select-layout even-horizontal \;\
  select-window -l \;\
  if-shell 'tmux has-session -t UwU' '' 'rename-session "UwU"'

# join a pane from another window into the current one
bind-key J command-prompt -p "join pane from:" "join-pane -hbs '%%'"

bind w kill-pane
bind E kill-pane -a         # leader+Shift+E — close all other panes

# zoom / maximize panes
bind m resize-pane -Z
bind o rotate-window -D     # leader+o — rotate
bind O rotate-window -U

# resize panes
# leader+r resize mode
bind r switch-client -T resize
bind -T resize h resize-pane -L 3 \; switch-client -T resize
bind -T resize j resize-pane -D 3 \; switch-client -T resize
bind -T resize k resize-pane -U 3 \; switch-client -T resize
bind -T resize l resize-pane -R 3 \; switch-client -T resize
bind -T resize Escape switch-client -T prefix
bind -T resize Enter switch-client -T prefix
bind -T resize q switch-client -T prefix

# Copy mode
bind c copy-mode
bind [ copy-mode
bind / copy-mode \; send-keys /

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection
bind -T copy-mode-vi Y send-keys -X end-of-line \; send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi H send-keys -X start-of-line
bind -T copy-mode-vi L send-keys -X end-of-line
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# Toggle status bar
bind T set -g status

# sessions
bind Space choose-tree -Zs
# new session, named, without leaving the current one
bind I command-prompt -p "new session name:" "new-session -s '%1' -c '~'"
# kill current session with confirmation, then switch to the previous one
bind X confirm-before -p "Kill #{session_name}? (y/n)" \
  "switch-client -l \; kill-session -t '#{session_name}'"

# clear scrollback
bind -n C-k send-keys "clear" Enter
bind -n C-S-x clear-history

# sessionizer
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# direct access to tabs
bind -n C-1 select-window -t 1
bind -n C-2 select-window -t 2
bind -n C-3 select-window -t 3
bind -n C-4 select-window -t 4
bind -n C-5 select-window -t 5
bind -n C-6 select-window -t 6
bind -n C-7 select-window -t 7
bind -n C-8 select-window -t 8
bind -n C-9 select-window -t 9

# Theme

# minimal-tmux-status colors
# Uncomment the plugin and these options to restore the theme.
# set -g @minimal-tmux-bg "#101010"
# set -g @minimal-tmux-fg "#A0A0A0"

# Then, restart tmux server
# Required when removing plugins or theme options that are still cached
# in the current tmux server.
# $ tmux kill-server

# Visual

set -g status-style "bg=#000000,fg=#d0d0d0"
set -g status-left "#[fg=#d0d0d0,bold] [#S] "
set -g status-left-length 24
set -g status-right ""

# Window status
setw -g window-status-current-format "#[fg=#d0d0d0,bg=#000000] #I:#{pane_title} #{window_flags} "
setw -g window-status-format "#[fg=#707070,bg=default] #I:#{pane_title} #{window_flags} "

# Pane borders
set -g pane-border-lines single
set -g pane-border-style "fg=#404040,bg=#000000"
set -g pane-active-border-style "fg=#808080,bg=#000000"

# Messages
set -g message-style "bg=#202020,fg=#d0d0d0"

# reload config
bind C-r source-file ~/.config/tmux/tmux.conf \; display-message "tmux configuration reloaded"
