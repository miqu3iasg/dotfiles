# ~/.config/tmux/tmux.conf

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'semi710/minimal-tmux-status'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-yank'

# resurrect saves/restores the whole server (all sessions, windows, panes)
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-pane-contents-area 'visible'
set -g @resurrect-save 'C-s'
set -g @resurrect-restore 'C-t'        # default C-r clashes with "reload config" below

# continuum auto-saves in the background; restoring is manual (prefix + C-t,
# resurrect's default bind set above) so a killed/crashed server never comes
# back on its own
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'

set -g @yank_with_mouse 'off'

# Shell
set -g default-shell /usr/bin/zsh
set -g default-command /usr/bin/zsh

# Terminal capabilities
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
# clipboard is a terminal feature, not a terminfo override
set -as terminal-features ",xterm-256color:clipboard"

# C-Tab, C-S-*, and C-1..9 below only register if the terminal sends them
# as CSI-u sequences; enable these if they don't fire
# set -s extended-keys on
# set -s extended-keys-format csi-u
unbind-key -T root C-l

# Prefix
# ctrl-b is freed up for zsh's autosuggest-accept (see .zshrc)
unbind-key C-b
set -g prefix C-space

# General / performance
set -g mouse off
set -g history-limit 102400
set -g repeat-time 225
set -g escape-time 0
set -g focus-events on
set -g renumber-windows on
set -g set-clipboard on
set -g status-position bottom
set -g status-keys vi
setw -g mode-keys vi
set -g base-index 0
setw -g pane-base-index 0
# set -g automatic-rename on
set -g automatic-rename off # Do not automatically rename windows from the running command.
set -g pane-scrollbars off
set -g pane-border-indicators off

# When the current session is killed, jump to the most recent remaining one
# instead of detaching (tmux only exits once the last session is gone)
set -g detach-on-destroy off

set-option -g set-titles on
set-option -g set-titles-string "#{pane_title}"

# Windows
bind t new-window -c "#{pane_current_path}"
bind q kill-window
bind R command-prompt -I "#W" "rename-window '%%'"
bind ^ last-window   # l is taken by pane navigation

bind -n C-Tab next-window
bind -n C-S-Tab previous-window

bind H swap-window -t -1
bind L swap-window -t +1

bind C-n select-layout even-vertical
bind C-p select-layout even-horizontal

# Splits / pane navigation
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n C-S-h select-pane -L
bind -n C-S-j select-pane -D
bind -n C-S-k select-pane -U
bind -n C-S-l select-pane -R

# explicit vim-aware Ctrl+h/j/k/l (redundant with vim-tmux-navigator, kept for clarity)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

bind-key b new-window -c "#{pane_current_path}"

# open (or reuse) a 2-pane "UwU" scratch layout in window 1
bind-key C-w \
  new-window -t 1 -c "#{pane_current_path}" \;\
  split-window -bd -h -c "#{pane_current_path}" \;\
  select-layout even-horizontal \;\
  select-window -l \;\
  if-shell 'tmux has-session -t =UwU' '' 'rename-session "UwU"'

bind-key J command-prompt -p "join pane from:" "join-pane -hbs '%%'"

bind w kill-pane
bind E kill-pane -a

bind m resize-pane -Z
bind o rotate-window -D
bind O rotate-window -U

bind g display-popup -E -d "#{pane_current_path}" -w 85% -h 85%

# resize mode: leader+r, then h/j/k/l repeatedly; Esc/Enter/q exits
bind r switch-client -T resize
bind -T resize h resize-pane -L 3 \; switch-client -T resize
bind -T resize j resize-pane -D 3 \; switch-client -T resize
bind -T resize k resize-pane -U 3 \; switch-client -T resize
bind -T resize l resize-pane -R 3 \; switch-client -T resize
bind -T resize Escape switch-client -T root
bind -T resize Enter switch-client -T root
bind -T resize q switch-client -T root

# Copy mode
bind c copy-mode
bind [ copy-mode
bind / copy-mode \; send-keys /

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
# y / Y are rebound near the bottom of this file, after tpm loads tmux-yank
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi H send-keys -X start-of-line
bind -T copy-mode-vi L send-keys -X end-of-line
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

bind T set -g status

# Sessions
bind Space choose-tree -Zs   # Enter=go, x=kill, t=tag, X=kill tagged, arrows fold
bind W choose-tree -Zw       # sessions > windows tree
bind Tab switch-client -l    # alternate between the last two sessions
# ( and ) = previous / next session (tmux defaults)

bind N command-prompt -p "new session name:" "new-session -A -s '%1' -c '#{pane_current_path}'"
# rename = leader+$ (tmux default)

bind z run-shell -b "~/.tmux/plugins/tmux-fzf/scripts/session.sh switch"

bind M command-prompt -p "move window to session:" "move-window -t '%1:'"

# detach-on-destroy=off means these drop you into the previous session
bind x kill-session                                                  # no confirmation
bind X confirm-before -p "kill session #S? (y/n)" kill-session
bind K confirm-before -p "kill ALL other sessions? (y/n)" "kill-session -a"

# zoxide + fzf: pick a dir -> creates/switches to a session named after it
bind-key -r f if-shell "$is_vim" \
    'run-shell "tmux neww ~/.local/bin/tmux-sessionizer"' \
    'send-keys " ~/.local/bin/tmux-sessionizer" Enter'

bind C run-shell "~/.local/bin/tmux-sessionizer ~/.config"
# bind D run-shell "~/.local/bin/tmux-sessionizer ~/dotfiles"

# clear scrollback
bind -n C-S-x clear-history

# Direct access to windows
bind -n C-1 select-window -t 1
bind -n C-2 select-window -t 2
bind -n C-3 select-window -t 3
bind -n C-4 select-window -t 4
bind -n C-5 select-window -t 5
bind -n C-6 select-window -t 6
bind -n C-7 select-window -t 7
bind -n C-8 select-window -t 8
bind -n C-9 select-window -t 9

# Theme / visual
# To restore minimal-tmux-status: uncomment its plugin line above and the two
# options below, then restart the server (`tmux kill-server`) since removed
# plugin options stay cached otherwise
# set -g @minimal-tmux-bg "#101010"
# set -g @minimal-tmux-fg "#A0A0A0"

set -g status-style "bg=#000000,fg=#d0d0d0"
set -g status-left "#[fg=#d0d0d0,bold] [#S] "
set -g status-left-length 24
# continuum appends its auto-save hook to status-right once tpm runs,
# so this must stay above `run tpm`
set -g status-right ""

setw -g window-status-current-format "#[fg=#d1d0d0,bg=#000000] #I:#{pane_title} #{window_flags} "
setw -g window-status-format "#[fg=#707070,bg=default] #I:#{pane_title} #{window_flags} "

set -g pane-border-lines single
set -g pane-border-style "fg=#404040,bg=#000000"
set -g pane-active-border-style "fg=#808080,bg=#000000"

set -g message-style "bg=#202020,fg=#d0d0d0"

# Reload loads whichever of the two default config paths exists
bind C-r source-file -q ~/.tmux.conf \; source-file -q ~/.config/tmux/tmux.conf \; display-message "tmux configuration reloaded"

# Keep this as the last plugin-related line
run '~/.tmux/plugins/tpm/tpm'

# Reclaim C-k from vim-tmux-navigator to clear the terminal
bind -n C-k send-keys "clear" Enter

# Override tmux-yank's prefix+y/Y bindings for session management
bind y new-session -A -s temp

# tmux-yank binds y/Y in copy-mode-vi; these override it with our own behavior
bind -T copy-mode-vi y send-keys -X copy-selection
bind -T copy-mode-vi Y send-keys -X end-of-line \; send-keys -X copy-selection-and-cancel
