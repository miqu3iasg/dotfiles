add_newline = true

palette = "insanity"

format = """
${custom.venv}\
$username\
$hostname\
$directory\
${custom.git_worktree}\
$line_break\
$character"""

[palettes.eyes_dark]
fg       = "#A0A0A0"
muted    = "#808080"
subtle   = "#606060"
faint    = "#404040"
faintest = "#202020"
red      = "#A09090"
green    = "#90A090"
yellow   = "#808080"
blue     = "#808080"
magenta  = "#606060"
cyan     = "#808080"
git_add  = "#90A090"
git_del  = "#A09090"

[palettes.insanity]
fg       = "#d0d0d0"
muted    = "#b9b9b9"
subtle   = "#87ffff"
faint    = "#4e4e4e"
faintest = "#202020"
red      = "#ff5f5f"
green    = "#87d787"
yellow   = "#ffd751"
blue     = "#5fafff"
magenta  = "#d75fd7"
cyan     = "#87ffff"
git_add  = "#87d787"
git_del  = "#ff5f5f"

[username]
show_always = true
style_user = "bold fg:green"
style_root = "bold underline fg:red"
format = "[$user]($style)@"

[hostname]
ssh_only = false
style = "fg:green"
format = "[$hostname]($style) "

[directory]
style = "bold fg:blue"
format = "[$read_only]($style)[$path]($style) "
truncation_length = 5
truncation_symbol = "./"
truncate_to_repo = false
read_only = "[ro] "

[custom.venv]
description = "Nome do virtualenv ativo"
when = 'test -n "$VIRTUAL_ENV"'
command = 'basename "$VIRTUAL_ENV"'
style = "fg:green"
format = '[\($output\) ]($style)'

[git_branch]
style = "bold fg:fg"
format = "[$branch]($style) "
truncation_length = 24
truncation_symbol = "…"

[git_state]
style = "fg:yellow"
format = '\([$state( $progress_current/$progress_total)]($style)\) '

[git_status]
style = "fg:red"
format = '([$all_status$ahead_behind]($style))'
conflicted = "conflict $count "
untracked  = "untracked $count "
stashed    = "stash $count "
modified   = "modified $count "
staged     = "staged $count "
renamed    = "renamed $count "
deleted    = "deleted $count "
ahead      = "ahead $count "
behind     = "behind $count "
diverged   = "diverged $ahead_count/$behind_count "
up_to_date = ""

[custom.git_worktree]
when = '[ "$(git rev-parse --path-format=absolute --git-dir 2>/dev/null)" != "$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null)" ]'
command = "echo worktree"
format = "[$output]($style) "
style = "fg:subtle"
require_repo = true
ignore_timeout = true

[character]
success_symbol = "[\\$ ](bold fg:green)"
error_symbol   = "[\\$ ](bold fg:red)"
vicmd_symbol   = "[\\$ ](bold fg:blue)"

[cmd_duration]
min_time = 2000
show_milliseconds = false
style = "fg:yellow"
format = "[$duration]($style) "

[jobs]
symbol = ""
style = "fg:subtle"
format = "[$number job]($style) "

[shlvl]
disabled = false
threshold = 2
style = "fg:muted"
format = "[shlvl:$shlvl]($style) "

[status]
disabled = false
style = "bold underline fg:red"
format = "[exit $status]($style) "
