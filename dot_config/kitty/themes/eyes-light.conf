# eyes-light.conf
# Kitty terminal theme baseado em amedoeyes/eyes.nvim (variante light)
# https://github.com/amedoeyes/eyes.nvim
# Tema monocromático em tons de cinza

# --- Cores básicas ---
foreground              #5F5F5F
background              #FFFFFF

# --- Cursor ---
cursor                  #5F5F5F
cursor_text_color       #FFFFFF

# --- Seleção ---
selection_foreground    #5F5F5F
selection_background    #DFDFDF

# --- URLs ---
url_color               #7F7F7F

# --- Bordas de janela (kitty splits) ---
active_border_color     #7F7F7F
inactive_border_color   #BFBFBF
bell_border_color       #7F7F7F

# --- Barra de abas ---
tab_bar_background      #FFFFFF
active_tab_foreground   #FFFFFF
active_tab_background   #5F5F5F
inactive_tab_foreground #8F8F8F
inactive_tab_background #EFEFEF

# --- Cores do terminal (0-15) ---
# black
color0   #FFFFFF
color8   #FFFFFF
# red
color1   #BFBFBF
color9   #BFBFBF
# green
color2   #9F9F9F
color10  #9F9F9F
