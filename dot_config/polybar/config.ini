; ============================================================
;  POLYBAR — minimal / monochrome / high-DPI-correct
;  preto puro + escala de cinza, sem cor de destaque saturada
; ============================================================

[colors]
background       = #000000
background-alt   = #0a0a0a
foreground       = #d8d8d8
foreground-dim   = #888888
foreground-alt   = #555555
disabled         = #2a2a2a
line             = #2a2a2a
; único "pop" de contraste do tema: branco puro sobre preto,
; usado só no workspace ativo — mantém tudo monocromático
active-bg        = #e8e8e8
active-fg        = #000000
urgent-bg        = #777777
urgent-fg        = #000000

[bar/minimal]
; --- unidades em px, não pt: evita o arredondamento de DPI
; que causa a serrilhagem do texto em barras finas ---
width = 100%
height = 17px
radius = 0
fixed-center = true
bottom = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2px
border-size = 0px
border-color = #00000000

padding-left = 1
padding-right = 1
module-margin = 0

separator = "%{F#2a2a2a}  %{F-}"

; fonte principal: peso Bold para compensar tamanho pequeno
; sem precisar aumentar o size — dá mais "peso ótico" ao texto
; e reduz a sensação de serrilhado em fontes finas
font-0 = "JetBrainsMono Nerd Font Mono:style=Bold:size=9;2"
; fonte secundária, só para glifos/ícones (bluetooth), leve offset
; vertical extra pra alinhar com a altura de 17px
font-1 = "JetBrainsMono Nerd Font Mono:style=Bold:size=10;3"

modules-left = i3
modules-center =
modules-right = date pulseaudio memory cpu temperature-cpu filesystem network updates tray battery

cursor-click = pointer
enable-ipc = true

; --- fixa o DPI em vez de deixar o polybar herdar/adivinhar do
; xrandr. Ajuste para o valor real do seu monitor (rode
; `xdpyinfo | grep resolution` pra conferir; 96 é o padrão
; pra a maioria dos monitores 1080p/1440p sem scaling) ---
dpi = 96

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true

label-focused = %name%
label-focused-foreground = ${colors.active-fg}
label-focused-background = ${colors.active-bg}
label-focused-padding = 1
label-focused-margin = 0

label-unfocused = %name%
label-unfocused-foreground = ${colors.foreground-dim}
label-unfocused-padding = 1
label-unfocused-margin = 0

label-urgent = %name%
label-urgent-foreground = ${colors.urgent-fg}
label-urgent-background = ${colors.urgent-bg}
label-urgent-padding = 1

label-visible = %name%
label-visible-foreground = ${colors.foreground}
label-visible-padding = 1

; ---------------------------------------------------------
; MÓDULOS SEM ÍCONE — só abreviação + valor, texto puro
; ---------------------------------------------------------

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-padding = 1
label = cpu %percentage%%
label-foreground = ${colors.foreground-dim}

[module/memory]
type = internal/memory
interval = 2
format = <label>
format-padding = 1
label = mem %percentage_used%%
label-foreground = ${colors.foreground-dim}

[module/filesystem]
type = internal/fs
interval = 30
mount-0 = /
format-mounted = <label-mounted>
format-mounted-padding = 1
label-mounted = disk %used%/%total%
label-foreground = ${colors.foreground-dim}

[module/network]
type = internal/network
interface = wlp0s20f3
interval = 2
accumulate-stats = true
format-connected = <label-connected>
format-connected-padding = 1
label-connected = net %downspeed:6% %upspeed:6%
label-connected-foreground = ${colors.foreground-dim}
format-disconnected-padding = 1
label-disconnected = net off
label-disconnected-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
format-volume-padding = 1
label-volume = vol %percentage%%
label-volume-foreground = ${colors.foreground}
format-muted-padding = 1
label-muted = vol mute
label-muted-foreground = ${colors.disabled}

[module/date]
type = internal/date
interval = 5
date = %a %d %b  %H:%M
date-alt = %H:%M:%S
label = %date%
label-foreground = ${colors.foreground}

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 100
poll-interval = 5
format-charging = <label-charging>
format-charging-padding = 1
label-charging = bat %percentage%%
label-charging-foreground = ${colors.foreground-dim}
format-discharging = <label-discharging>
format-discharging-padding = 1
label-discharging = bat %percentage%%
label-discharging-foreground = ${colors.foreground-dim}
format-full = <label-full>
format-full-padding = 1
label-full = bat full
label-full-foreground = ${colors.foreground-dim}

[module/temperature-cpu]
type = internal/temperature
thermal-zone = 0
warn-temperature = 80
format = <label>
format-padding = 1
format-warn = <label-warn>
format-warn-padding = 1
label = temp %temperature-c%
label-foreground = ${colors.foreground-dim}
label-warn = temp %temperature-c%
label-warn-foreground = ${colors.foreground}

[module/updates]
type = custom/script
exec = echo "upd $(checkupdates 2>/dev/null | wc -l)"
interval = 1800
format = <label>
format-padding = 1
label = %output%
label-foreground = ${colors.foreground-dim}

; ---------------------------------------------------------
; ÚNICO módulo com ícone: bluetooth (símbolo + nº de
; dispositivos conectados). Usa font-1 pro glifo.
; requer o script scripts/bluetooth.sh (veja abaixo)
; ---------------------------------------------------------

[module/bluetooth]
type = custom/script
exec = bash ~/.config/polybar/scripts/bluetooth.sh
interval = 5
format = <label>
format-padding = 1
label = %output%
label-foreground = ${colors.foreground}
label-font = 2

[module/tray]
type = internal/tray
tray-spacing = 8px
format-margin = 1

[settings]
screenchange-reload = true

[global/wm]
margin-top = 0
margin-bottom = 0
