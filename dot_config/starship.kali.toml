add_newline = true

palette = "insanity"

format = """
[┌──](fg:green)\
${custom.venv}\
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
${custom.git_worktree}\
$os\
$line_break\
$character"""

right_format = """$cmd_duration$jobs$shlvl$status"""

[palettes.eyes_dark]
fg       = "#A0A0A0"
muted    = "#808080"
subtle   = "#606060"
faint    = "#404040"
faintest = "#202020"
red      = "#A09090"
green    = "#90A090"
blue     = "#8090A0"
git_add  = "#90A090"
git_del  = "#A09090"

[palettes.insanity]
fg       = "#d0d0d0"
muted    = "#b9b9b9"
subtle   = "#8a8a8a"
faint    = "#4e4e4e"
faintest = "#202020"
red      = "#ff5f5f"
green    = "#87d787"
blue     = "#5fafff"
git_add  = "#87d787"
git_del  = "#ff5f5f"

[os]
disabled = false
format = "[$symbol](fg:green)"

[os.symbols]
Arch = "λ"

[username]
show_always = true
style_user = "bold fg:green"
style_root = "bold fg:red"
format = '[\(](fg:green)[$user]($style)'

[hostname]
ssh_only = false
style = "bold fg:green"
format = '[@$hostname]($style)[\)](fg:green)'

[directory]
truncation_length = 5
truncation_symbol = "…/"
truncate_to_repo = false
style = "bold fg:blue"
read_only = " ro"
format = '[-\[](fg:green)[$path]($style)[$read_only](fg:red)[\]](fg:green) '

[custom.venv]
description = "Name of the active virtualenv"
when = 'test -n "$VIRTUAL_ENV"'
command = 'basename "$VIRTUAL_ENV"'
format = '[\($output\)─](fg:green)'

[git_branch]
symbol = ""
style = "bold fg:muted"
format = "[$branch]($style) "
truncation_length = 24
truncation_symbol = "…"

[git_state]
style = "fg:muted"
format = '\([$state( $progress_current/$progress_total)]($style)\) '

[git_status]
style = "fg:subtle"
format = '([$all_status$ahead_behind]($style))'
conflicted = "conflict $count "
untracked  = "untracked $count "
stashed    = "stash $count "
modified   = "modified $count "
staged     = "staged $count "
renamed    = "renamed $count "
deleted    = "deleted $count "
ahead      = "ahead $count "
behind     = "behind $count "
diverged   = "diverged $ahead_count/$behind_count "
up_to_date = ""

[custom.git_worktree]
description = "Shown when inside a git worktree (not the main working tree)"
when = '[ "$(git rev-parse --path-format=absolute --git-dir 2>/dev/null)" != "$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null)" ]'
command = "echo worktree"
format = "[$output]($style) "
style = "fg:subtle"
require_repo = true
ignore_timeout = true

[character]
success_symbol = "[└─](fg:green)[\\$ ](bold fg:fg)"
error_symbol   = "[└─](fg:green)[\\$ ](bold fg:red)"
vicmd_symbol   = "[└─](fg:green)[\\$ ](bold fg:muted)"

[cmd_duration]
min_time = 2000
style = "fg:subtle"
format = "[$duration]($style) "

[jobs]
symbol = ""
style = "fg:subtle"
format = "[$number job]($style) "

[shlvl]
disabled = false
threshold = 2
style = "fg:subtle"
format = "[shlvl:$shlvl]($style) "

[status]
disabled = false
style = "bold fg:red"
format = "[exit $status]($style) "
